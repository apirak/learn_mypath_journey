name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The build imports <MyPath> from the sibling repo's source (ADR-0001),
      # so both repos are checked out side by side like on a dev machine.
      - uses: actions/checkout@v4
        with:
          path: learn_mypath_journey
      - uses: actions/checkout@v4
        with:
          repository: apirak/MyPath
          token: ${{ secrets.MYPATH_REPO_TOKEN }}
          path: learn_mypath

      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install sibling SDK deps
        working-directory: learn_mypath
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install
        working-directory: learn_mypath_journey
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: learn_mypath_journey
        # 404.html = index.html so deep links (BrowserRouter) load the app.
        run: pnpm build && cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: learn_mypath_journey/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
